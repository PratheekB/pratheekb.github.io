<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Under construction – Pratheek B</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=28" />
  <script src="theme.js?v=5"></script>
  <style>
    .secret {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .secret .snap {
      display: block;
      width: min(280px, 72vw);
      height: auto;
      border-radius: 12px;
      box-shadow: var(--photo-ring);
      margin-bottom: 24px;
    }

    .secret h1 {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
      text-wrap: balance;
      margin: 0 0 28px;
    }
  </style>
</head>

<body>
  <button type="button" class="theme-toggle" aria-label="Change theme" title="Change theme">
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
    <svg class="icon-auto" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
  </button>
  <main class="secret">
    <img class="snap" src="swap.jpg" alt="Pratheek at the controls of an excavator" width="640" height="800" />
    <h1>Under construction</h1>
    <a href="./">← Back</a>
  </main>
  <script>
    // Click or tap the photo three times in a row to open the blog and vault page
    (function () {
      var count = 0;
      var timer;
      document.querySelector('.snap').addEventListener('click', function () {
        count++;
        clearTimeout(timer);
        timer = setTimeout(function () { count = 0; }, 1500);
        if (count === 3) window.location.href = 'doors.html';
      });
    })();
  </script>
</body>

</html>
